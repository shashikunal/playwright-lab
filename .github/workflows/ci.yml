name: Playwright Industrial Lab CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Industrial Test Matrix & Cross-Browser Execution
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies reproducibly
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: TypeScript monorepo type-check
        run: pnpm run typecheck

      - name: Lint codebase
        run: pnpm run lint

      - name: Build applications and packages
        run: pnpm run build

      - name: Install Playwright browsers and OS dependencies
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run Playwright test suites (Matrix & Devices)
        run: pnpm run test:e2e
        env:
          CI: true

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Test Results & Failure Traces
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-failure-diagnostics
          path: test-results/
          retention-days: 14
